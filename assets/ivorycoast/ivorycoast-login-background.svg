<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <rect width="3840" height="2160" fill="#f7f2e8"/>
  <rect x="0" y="0" width="1240" height="2160" fill="#f2992f"/>
  <rect x="2600" y="0" width="1240" height="2160" fill="#1f8a4c"/>
  <rect x="1240" y="0" width="1360" height="2160" fill="#d9d4ca"/>

  <circle cx="3000" cy="400" r="360" fill="#ffffff" opacity="0.16"/>
  <circle cx="900" cy="1800" r="460" fill="#ffffff" opacity="0.14"/>
  <circle cx="2000" cy="1250" r="620" fill="#f2992f" opacity="0.08"/>

  <!-- Doctor + patient diagnosis illustration (line art) -->
  <g opacity="0.24" stroke="#1b1b1b" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Doctor body -->
    <circle cx="2850" cy="1040" r="110"/>
    <path d="M2680 1420 q170 -220 340 0"/>
    <path d="M2750 1160 v200"/>
    <path d="M2950 1160 v200"/>
    <path d="M2820 1420 v260"/>
    <path d="M2880 1420 v260"/>

    <!-- Stethoscope -->
    <path d="M2760 1280 q90 100 180 0"/>
    <circle cx="2850" cy="1380" r="26"/>

    <!-- Patient on bed -->
    <path d="M1920 1540 h520"/>
    <path d="M2000 1540 v-140 h400 v140"/>
    <circle cx="2120" cy="1340" r="70"/>
    <path d="M2100 1400 h260"/>
    <path d="M2320 1400 v-70"/>

    <!-- Lab table -->
    <path d="M2300 920 h360"/>
    <path d="M2360 920 v220"/>
    <path d="M2600 920 v220"/>
    <path d="M2440 980 h120"/>

    <!-- Test tubes -->
    <path d="M2380 980 v80"/>
    <path d="M2460 980 v120"/>
    <path d="M2540 980 v100"/>

    <!-- Microscope -->
    <path d="M3180 1200 h220"/>
    <path d="M3240 1200 v-120"/>
    <path d="M3300 1200 v-200"/>
    <path d="M3220 1000 h140"/>
    <path d="M3280 1000 v-80"/>
  </g>

  <!-- Diagnostic icons -->
  <g opacity="0.22" stroke="#1b1b1b" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3080 720 c0 80 -60 120 -60 180 s60 100 120 100 s120 -40 120 -100 s-60 -100 -60 -180"/>
    <path d="M3140 760 h120"/>
    <path d="M3130 860 h140"/>
  </g>

  <g opacity="0.22" stroke="#1b1b1b" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="3320" cy="1720" r="92"/>
    <path d="M3320 1660 v120"/>
    <path d="M3260 1720 h120"/>
  </g>
</svg>
